<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <g transform="translate(256,256)" fill="none" stroke="white" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <!-- Pillar base -->
    <rect x="-100" y="110" width="200" height="20" rx="6" fill="white" stroke="none"/>
    <!-- Pillar -->
    <line x1="0" y1="110" x2="0" y2="-50"/>
    <!-- Scale beam -->
    <line x1="-90" y1="-50" x2="90" y2="-50"/>
    <!-- Top triangle -->
    <polygon points="0,-80 -20,-50 20,-50" fill="white" stroke="none"/>
    <!-- Left pan -->
    <line x1="-90" y1="-50" x2="-90" y2="-10"/>
    <path d="M-125,-10 Q-90,40 -55,-10" fill="white" stroke="white" stroke-width="8"/>
    <!-- Right pan -->
    <line x1="90" y1="-50" x2="90" y2="-10"/>
    <path d="M55,-10 Q90,40 125,-10" fill="white" stroke="white" stroke-width="8"/>
    <!-- Gavel overlay -->
    <g transform="translate(0,-130) rotate(-30)">
      <rect x="-10" y="-24" width="20" height="48" rx="5" fill="white" stroke="none"/>
      <line x1="0" y1="24" x2="0" y2="56" stroke="white" stroke-width="7"/>
    </g>
  </g>
</svg>
