<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="192" height="192" rx="40" fill="url(#bg)"/>
  <g transform="translate(96,96)" fill="none" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Pillar base -->
    <rect x="-40" y="44" width="80" height="8" rx="2" fill="white" stroke="none"/>
    <!-- Pillar -->
    <line x1="0" y1="44" x2="0" y2="-20"/>
    <!-- Scale beam -->
    <line x1="-36" y1="-20" x2="36" y2="-20"/>
    <!-- Top triangle -->
    <polygon points="0,-32 -8,-20 8,-20" fill="white" stroke="none"/>
    <!-- Left pan -->
    <line x1="-36" y1="-20" x2="-36" y2="-4"/>
    <path d="M-50,-4 Q-36,16 -22,-4" fill="white" stroke="white" stroke-width="3"/>
    <!-- Right pan -->
    <line x1="36" y1="-20" x2="36" y2="-4"/>
    <path d="M22,-4 Q36,16 50,-4" fill="white" stroke="white" stroke-width="3"/>
    <!-- Gavel overlay small -->
    <g transform="translate(0,-52) rotate(-30)">
      <rect x="-4" y="-10" width="8" height="20" rx="2" fill="white" stroke="none"/>
      <line x1="0" y1="10" x2="0" y2="24" stroke="white" stroke-width="3"/>
    </g>
  </g>
</svg>
